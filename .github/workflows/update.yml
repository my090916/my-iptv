name: update-iptv

on:
  schedule:
    # UTC 16:10 = 北京时间次日 00:10
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成直播源
        run: python cloud_gen.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.txt tv.m3u
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%d)"
          git push
